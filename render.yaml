# Render Blueprint: one-click deploy of the live demo (free plan, builds the Dockerfile).
# Data lives on the container's disk, so the demo data is re-seeded whenever the service restarts.
services:
  - type: web
    name: leavedesk
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: TRUST_PROXY
        value: "1"
      # Render's load balancer hides visitor IPs from the app, so all demo users share one
      # rate-limit bucket. A higher limit keeps assessors from locking each other out.
      - key: LOGIN_RATE_LIMIT
        value: "300"
      - key: COOKIE_SECURE
        value: "true"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      # Set in the Render dashboard (never commit keys). Unset = AI features hidden.
      - key: GROQ_API_KEY
        sync: false
      # Leave RESEND_API_KEY unset for demo mode (verification code shown on screen).
