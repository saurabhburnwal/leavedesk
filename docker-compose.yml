services:
  leave-management:
    build: .
    image: leave-management-system:latest
    container_name: leave-management-system
    ports:
      - "3000:3000"
    environment:
      # Optional: set your own secret; otherwise one is generated and stored in the volume.
      # JWT_SECRET: change-me
      SEED_DEMO_DATA: "true"
      # Real verification emails: put these in a .env file next to this file (docker compose reads it).
      # Leave RESEND_API_KEY empty for demo mode (code shown on screen).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-LeaveDesk <onboarding@resend.dev>}
      # Optional AI assistant (hidden when empty).
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
    volumes:
      - leave-data:/app/data
    restart: unless-stopped

volumes:
  leave-data:
